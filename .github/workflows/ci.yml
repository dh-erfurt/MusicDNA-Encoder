name: CI

on:
  push:
  pull_request:

env:
  # Turn a missing Plaine & Easie reader from a silent skip into a failure so
  # the notation conformance checks always run in CI.
  MUSICDNA_REQUIRE_PAE_READER: "1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - name: Install the Verovio reader
        # Verovio is the reference implementation of Plaine & Easie. Its Python
        # wheels are built without the PAE importer, so the round trip reaches it
        # through the JavaScript toolkit.
        run: npm ci
      - run: uv sync --locked --python 3.10
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run mypy --strict
      - run: uv run python -m build
      - name: Verify wheel release contract
        run: |
          python - <<'PY'
          from glob import glob
          from zipfile import ZipFile

          wheels = glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              metadata_name = next(name for name in names if name.endswith("/METADATA"))
              metadata = archive.read(metadata_name).decode()
          notices = [name for name in names if name.endswith("THIRD_PARTY_NOTICES.txt")]
          assert len(notices) == 1, notices
          assert "/licenses/THIRD_PARTY_NOTICES.txt" in notices[0], notices
          assert "musicdna_encoder/__init__.py" in names
          assert "musicdna_encoder/py.typed" in names
          assert "Version: 0.9.0" in metadata
          assert "Description-Content-Type: text/x-rst" in metadata
          assert "MusicDNA-Encoder" in metadata
          PY
      - name: Install and import built wheel
        run: |
          python -m venv /tmp/musicdna-wheel
          /tmp/musicdna-wheel/bin/python -m pip install --disable-pip-version-check dist/*.whl
          /tmp/musicdna-wheel/bin/python -c "import musicdna_encoder; print(musicdna_encoder.__name__)"
          /tmp/musicdna-wheel/bin/musicdna-encoder --help
